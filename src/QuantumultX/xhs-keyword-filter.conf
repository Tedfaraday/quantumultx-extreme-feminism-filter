#!name=小紅書極端女權言論關鍵詞屏蔽
#!desc=僅按帖子標題、正文/簡介和標籤過濾；解析失敗時原樣放行
#!version={{VERSION}}

# 若已有 [mitm] hostname，請把以下域名合併到原列表，不要覆蓋既有域名。
# 滾動資源與腳本引用由工具生成；固定版本另見 pinned 入口。
hostname = edith.xiaohongshu.com, rec.xiaohongshu.com, www.xiaohongshu.com, so.xiaohongshu.com

# 首頁推薦流
^https:\/\/(?:edith|rec|www)\.xiaohongshu\.com\/api\/sns\/v\d+\/homefeed(?:\?|$) url script-response-body {{SCRIPT_URL}}

# 搜尋帖子
^https:\/\/(?:so|edith)\.xiaohongshu\.com\/api\/sns\/v\d+\/search\/notes(?:\?|$) url script-response-body {{SCRIPT_URL}}

# 關注頁資訊流
^https:\/\/(?:edith|rec|www)\.xiaohongshu\.com\/api\/sns\/v\d+\/followfeed(?:\?|$) url script-response-body {{SCRIPT_URL}}
^https:\/\/(?:edith|rec|www)\.xiaohongshu\.com\/api\/sns\/v\d+\/user\/followings\/followfeed(?:\?|$) url script-response-body {{SCRIPT_URL}}
