# 若已有 [mitm] hostname，請把以下域名合併到原列表，不要覆蓋既有域名。
# 腳本固定到 v0.1.0；遠端資源更新後可由新版 CONF 切換到下一個版本。
hostname = edith.xiaohongshu.com, rec.xiaohongshu.com, www.xiaohongshu.com, so.xiaohongshu.com

# 首頁推薦流
^https:\/\/(?:edith|rec|www)\.xiaohongshu\.com\/api\/sns\/v\d+\/homefeed(?:\?|$) url script-response-body https://raw.githubusercontent.com/Tedfaraday/quantumultx-extreme-feminism-filter/v0.1.0/Scripts/Xiaohongshu/xhs-keyword-filter.js

# 搜尋帖子
^https:\/\/(?:so|edith)\.xiaohongshu\.com\/api\/sns\/v\d+\/search\/notes(?:\?|$) url script-response-body https://raw.githubusercontent.com/Tedfaraday/quantumultx-extreme-feminism-filter/v0.1.0/Scripts/Xiaohongshu/xhs-keyword-filter.js

# 關注頁資訊流
^https:\/\/(?:edith|rec|www)\.xiaohongshu\.com\/api\/sns\/v\d+\/followfeed(?:\?|$) url script-response-body https://raw.githubusercontent.com/Tedfaraday/quantumultx-extreme-feminism-filter/v0.1.0/Scripts/Xiaohongshu/xhs-keyword-filter.js
^https:\/\/(?:edith|rec|www)\.xiaohongshu\.com\/api\/sns\/v\d+\/user\/followings\/followfeed(?:\?|$) url script-response-body https://raw.githubusercontent.com/Tedfaraday/quantumultx-extreme-feminism-filter/v0.1.0/Scripts/Xiaohongshu/xhs-keyword-filter.js
