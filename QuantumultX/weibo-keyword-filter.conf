#!name=微博極端女權言論關鍵詞屏蔽
#!desc=僅按微博正文、卡片標題與話題文字過濾；解析失敗時原樣放行
#!version=0.2.0

# 若已有 [mitm] hostname，請把以下網域合併到原列表，不要覆蓋既有網域。
# 僅列入目前公開重寫鏈路直接使用的兩個主要 API 主機，不使用 *.weibo.* 萬用網域。
# 腳本固定到 v0.2.0；遠端資源更新後可由新版 CONF 切換到下一個版本。
hostname = api.weibo.cn, mapi.weibo.com

# 首頁、關注與分組資訊流：常見 root.statuses 或 root.items 結構。
^https:\/\/(?:api\.weibo\.cn|mapi\.weibo\.com)\/2\/(?:statuses\/(?:container_timeline(?:_(?:hot|unread))?|(?:unread_)?friends(?:\/|_)timeline|unread_hot_timeline)|groups\/timeline)(?:\?|$) url script-response-body https://raw.githubusercontent.com/Tedfaraday/quantumultx-extreme-feminism-filter/v0.2.0/Scripts/Weibo/weibo-keyword-filter.js

# 搜尋與超話資訊流：只處理可辨識的 feed、mblog 或 card_group 帖子項。
^https:\/\/(?:api\.weibo\.cn|mapi\.weibo\.com)\/2\/(?:cardlist|searchall|search\/(?:finder|container_timeline|container_discover)|statuses\/container_timeline_topic(?:page)?)(?:\?|$) url script-response-body https://raw.githubusercontent.com/Tedfaraday/quantumultx-extreme-feminism-filter/v0.2.0/Scripts/Weibo/weibo-keyword-filter.js
